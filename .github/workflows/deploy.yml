name: Deploy Twitter Service via Dokploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - '.github/actions/deploy-dokploy/action.yml'
  workflow_dispatch:

concurrency:
  group: twitter-service-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through Dokploy
        uses: ./.github/actions/deploy-dokploy
        with:
          compose_id: 6EWHGpJiY4TfeQyQNOIDa
          dokploy_api_key: ${{ secrets.DOKPLOY_API_KEY }}
